<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <title>𝑳𝑰𝒁𝑶𝑹𝑮𝑰𝑵 𝑺𝑻𝑶𝑹𝑬</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="brand">𝑳𝑰𝒁𝑶𝑹𝑮𝑰𝑵 𝑺𝑻𝑶𝑹𝑬</div>
      <div class="sub">PUBG ACCOUNTS • MARKET</div>
    </div>
    <button class="icon-btn" id="openCart">🛒 <b id="cartCount">0</b></button>
  </header>

  <main>
    <div class="hero">
      <h1>Аккаунты PUBG</h1>
      <p>Выбирай аккаунт, добавляй в корзину или предложи свою цену.</p>
    </div>

    <div class="categories" id="categories"></div>
    <section class="grid" id="products"></section>

    <div class="sell-card">
      <div>
        <div class="sell-title">Есть аккаунт на продажу?</div>
        <div class="sell-text">Предложи свой аккаунт — мы рассмотрим его.</div>
      </div>
      <button class="primary" id="sellBtn">Предложить аккаунт</button>
    </div>

    <div class="links">
      <button onclick="openTG('reviews')">🎥 Обзоры</button>
      <button onclick="openTG('telegram')">📢 Наш Telegram</button>
    </div>
  </main>

  <div class="modal hidden" id="modal">
    <div class="sheet">
      <button class="close" id="closeModal">×</button>
      <img id="modalImg" class="modal-img" alt="">
      <div class="tag" id="modalCat"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <div class="price big" id="modalPrice"></div>
      <div class="actions">
        <button class="primary" id="modalCart">🛒 В корзину</button>
        <button class="secondary" id="modalReview">🎥 Смотреть обзор</button>
        <button class="secondary" id="modalOffer">💬 Предложить свою цену</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="cartModal">
    <div class="sheet">
      <button class="close" id="closeCart">×</button>
      <h2>🛒 Корзина</h2>
      <div id="cartItems"></div>
      <div class="total" id="cartTotal"></div>
      <button class="primary wide" id="checkout">💳 Оформить заказ</button>
    </div>
  </div>

  <div class="modal hidden" id="sellModal">
    <div class="sheet">
      <button class="close" id="closeSell">×</button>
      <h2>💬 Предложить аккаунт</h2>
      <p class="muted">Заполни данные — заявка уйдёт владельцу магазина.</p>
      <input id="sellTitle" placeholder="Название аккаунта">
      <input id="sellPrice" placeholder="Желаемая цена" inputmode="decimal">
      <textarea id="sellDesc" placeholder="Описание: скины, ранг, инвентарь и т.д."></textarea>
      <button class="primary wide" id="sendSell">Отправить предложение</button>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
